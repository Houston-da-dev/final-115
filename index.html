<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic Tac Toe</title>
        <link rel="stylesheet" href="tic.css">
    </head>
    <body>
        <header>
            <h1>Welcome to TIC-TAC-TOE</h1>
            <h2>P1 - <span id="player1">0</span> vs P2 - <span id="player2">0</span></h2>
        </header>
        <div id="board">
            <div id="top-left" class="cell"><p>X</p></div>
            <div id="top-center" class="cell"><p>O</p></div>
            <div id="top-right" class="cell"><p></p></div>
            <div id="center-left" class="cell"><p></p></div>
            <div id="center-center" class="cell"><p></p></div>
            <div id="center-right" class="cell"><p></p></div>
            <div id="bottom-left" class="cell"><p></p></div>
            <div id="bottom-center" class="cell"><p></p></div>
            <div id="bottom-right" class="cell"><p></p></div>
        </div>
        <script src="toe.js"></script>
    </body>
</html>
